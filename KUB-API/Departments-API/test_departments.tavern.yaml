test_name: When request with valid json body, POST /departments returns 201

marks:
  - usefixtures:
      - department_setup_description
      - department_cleanup_description
      - department_cleanup_check_description
  - parametrize:
      key:
        - request_name
      vals:
        - [ "Computer Science Department" ]
stages:
  - &create_department
    name: "{department_setup_description}"
    request:
      url: "{tavern.env_vars.BASE_URL}/departments"
      method: POST
      headers:
        Authorization: "Bearer {tavern.env_vars.TOKEN}"
        Content-Type: "application/json"
      json:
        name: "{request_name}"
    response:
      status_code: 201
      json:
        id: !anyint 
        name: "{request_name}"
      save:
        json:
          returned_id: id

  - name: "When response with valid json body structure, GET /departments returns 200"
    request:
      url: "{tavern.env_vars.BASE_URL}/departments"
      method: GET
      headers:
        Authorization: "Bearer {tavern.env_vars.TOKEN}"
        Content-Type: "application/json"
      json:
        nameContains: "{request_name}"
    response:
      status_code: 200
      verify_response_with:
        function: tavern.helpers:validate_pykwalify
          #Check response for valid schema according to openapi spec
          #validate_pykwalify used to validate more complicated JSON schemas
        extra_kwargs:
          schema:
            type: seq
            required: True
            matching: "all"
            sequence:
              - type: map
                mapping:
                  id:
                    type: int
                    required: True
                  name:
                    type: str
                    required: True

finally:
  - &delete_department
    name: "{department_cleanup_description}"
    request:
      url: "{tavern.env_vars.BASE_URL}/departments/{returned_id}"
      method: DELETE
      headers:
        Authorization: "Bearer {tavern.env_vars.TOKEN}"
    response:
      status_code: 204

  - &delete_department_check
    name: "department_cleanup_check_description"
    request:
      url: "{tavern.env_vars.BASE_URL}/departments/{returned_id}"
      method: GET
      headers:
        Authorization: "Bearer {tavern.env_vars.TOKEN}"
    response:
      status_code: 404

---

test_name: When request without json body, POST /departments returns 400

stages:
  - name: "When request without json body, POST /departments returns 400"
    request:
      url: "{tavern.env_vars.BASE_URL}/departments"
      method: POST
      headers:
        Authorization: "Bearer {tavern.env_vars.TOKEN}"
        Content-Type: "application/json"
    response:
      status_code: 400

