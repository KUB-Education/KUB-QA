test_name: When request with invalid security key header, POST /departments returns 401

marks:
  - parametrize:
      key:
        - wrong_token
        - request_name
      vals:
        - [ "satsgag", "Computer Science Department" ]

stages:
  - name: "When request with invalid security key header, POST /departments returns 401"
    request:
      url: "{tavern.env_vars.BASE_URL}/departments"
      method: POST
      headers:
        Authorization: "Bearer {tavern.env_vars.TOKEN}"
        Content-Type: "application/json"
      json:
        name: "{request_name}"
    response:
      status_code: 401

---

test_name: When request with wrong json body data, POST /departments returns 422

marks:
  - parametrize:
      key:
        - wrong_request_name
      vals:
        - [ "" ]

stages:
  - name: "When request with wrong json body data, POST /departments returns 422"
    request:
      url: "{tavern.env_vars.BASE_URL}/departments"
      method: POST
      headers:
        Authorization: "Bearer {tavern.env_vars.TOKEN}"
        Content-Type: "application/json"
      json:
        name: "{wrong_request_name}"
    response:
      status_code: 422

---

test_name: When request with json body that data match another user data, POST /departments returns 409

marks:
  - usefixtures:
    - department_setup_description
    - department_cleanup_description
    - department_cleanup_check_description
  - parametrize:
      key:
        - request_name
      vals:
        - [ "Computer Science Department"  ]

stages:
  - *create_admin

  - name: "When request with json body that data match another user data, POST /departments returns 409"
    request:
      url: "{tavern.env_vars.BASE_URL}/departments"
      method: POST
      headers:
        Authorization: "Bearer {tavern.env_vars.TOKEN}"
        Content-Type: "application/json"
      json:
        name: "{request_name}"
    response:
      status_code: 409

finally:
  - *delete_department

  - *delete_department_check
