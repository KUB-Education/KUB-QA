test_name: When request is made, GET /departments/id returns 200 and a json body that matches created department

marks:
   - usefixtures:
      - department_setup_description
      - department_cleanup_description
      - department_cleanup_check_description
  - parametrize:
      key:
        - request_name
      vals:
        - [ "Computer Science Department" ]

stages:
  - &create_department_save_all
    name: "{department_setup_description}"
    request:
      url: "{tavern.env_vars.BASE_URL}/departments"
      method: POST
      headers:
        Authorization: "Bearer {tavern.env_vars.TOKEN}"
        Content-Type: "application/json"
      json:
        name: "{request_name}"
    response:
      status_code: 201
      json:
        id: !anyint
        name: "{request_name}"
      save:
        json:
          returned_id: id
          returned_name: name

  - name: "When request is made,
            GET /departments/id returns 200 and a json body that matches created department"
    request:
      url: "{tavern.env_vars.BASE_URL}/departments/{returned_id}"
      method: GET
      headers:
        Authorization: "Bearer {tavern.env_vars.TOKEN}"
    response:
      status_code: 200
      json:
        id: !int "{returned_id:d}"
        name: "{returned_name}"


finally:
  - &delete_department
    name: "{department_cleanup_description}"
    request:
      url: "{tavern.env_vars.BASE_URL}/departments/{returned_id}"
      method: DELETE
      headers:
        Authorization: "Bearer {tavern.env_vars.TOKEN}"
    response:
      status_code: 204

  - &delete_department_check
    name: "department_cleanup_check_description"
    request:
      url: "{tavern.env_vars.BASE_URL}/departments/{returned_id}"
      method: GET
      headers:
        Authorization: "Bearer {tavern.env_vars.TOKEN}"
    response:
      status_code: 404


---

test_name: When request with invalid security key header, GET /departments/id returns 401

marks:
  - usefixtures:
    - department_setup_description
    - department_cleanup_description
    - department_cleanup_check_description
  - parametrize:
      key:
        - wrong_token
        - request_name
      vals:
        - [ "satsgag", "Computer Science Department" ]

stages:
  - *create_department_save_id

  - name: "When request with invalid security key header, GET /departments/id returns 401"
    request:
      url: "{tavern.env_vars.BASE_URL}/departments/{returned_id}"
      method: GET
      headers:
        Authorization: "Bearer {wrong_token}"
    response:
      status_code: 401

finally:
  - *delete_department

  - *delete_department_check
  
---

test_name: When department deleted, GET /departments/id returns 404

marks:
  - usefixtures:
    - department_setup_description
    - department_cleanup_description
    - department_cleanup_check_description
  - parametrize:
      key:
        - request_name
      vals:
        - ["Computer Science Department"]

stages:
  - *create_department_save_id

finally:
  - *delete_department

  - *delete_department_check

---

test_name: When id from department that not exist, GET /departments/id returns 404

marks:
  - parametrize:
      key:
        - wrong_id
      vals:
        - [ -1 ]

stages:
  - name: "When id from department that not exist, GET /departments/id returns 404"
    request:
      url: "{tavern.env_vars.BASE_URL}/departments/{wrong_id}"
      method: GET
      headers:
        Authorization: "Bearer {tavern.env_vars.TOKEN}"
    response:
      status_code: 404
