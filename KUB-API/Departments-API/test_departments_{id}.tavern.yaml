test_name:  When a request with a valid json body, PUT /departments/id returns 200 and a json body that matches request

marks:
  - usefixtures:
    - department_setup_description
    - department_cleanup_description
    - department_cleanup_check_description
  - parametrize:
      key:
        - request_name
        - update_name
      vals:
        - ["Computer Science Department", "Math Department"]

stages:
  - *create_department_save_all

  - name: "When a request with a valid json body,
            PUT /departments/id returns 200 and a json body that matches request"
    request:
      url: "{tavern.env_vars.BASE_URL}/departments/{returned_id}"
      method: PUT
      headers:
        Authorization: "Bearer {tavern.env_vars.TOKEN}"
        Content-Type: "application/json"
      json:
        name: "{update_name}"
    response:
      status_code: 200
      json:
        id: !int "{returned_id:d}"
        name: "{update_name}"

  - name: "When request is made,
            GET /departments/id returns 200 and a json body that matches updated department"
    request:
      url: "{tavern.env_vars.BASE_URL}/departments/{returned_id}"
      method: GET
      headers:
        Authorization: "Bearer {tavern.env_vars.TOKEN}"
    response:
      status_code: 200
      json:
        id: !int "{returned_id:d}"
        name: "{update_name}"
    

finally:
  - *delete_department

  - *delete_department_check

