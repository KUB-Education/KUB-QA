test_name: When request with json body that data match another student data, POST /students returns 409

marks:
  - parametrize:
      key:
        - request_last_name
        - request_first_name
        - request_middle_name
        - request_email
      vals:
        - [ "Doe", "John", "", "john.doe@example.com"]

stages:
  - *auth_save_token
  
  - *create_student

  - name: "When request with json body that data match another student data, POST /students returns 409"
    request:
      url: "{tavern.env_vars.BASE_URL}/students"
      method: POST
      headers:
        Authorization: "Bearer {returned_access_token}"
        Content-Type: "application/json"
      json:
        last_name: "{request_last_name}"
        first_name: "{request_first_name}"
        middle_name: "{request_middle_name}"
        email: "{request_email}"
    response:
      status_code: 409

finally:
  - *delete_student

  - *delete_student_check

