test_name:  When a request with a valid json body, PUT /students/id returns 200 and a json body that matches request

marks:
  - parametrize:
      key:
        - request_last_name
        - request_first_name
        - request_middle_name
        - request_email
        - update_last_name
        - update_first_name
        - update_middle_name
        - update_email
      vals:
        - [ "Doe", "John", "", "john.doe@example.com", "Joe", "Dohn", "Doj", "john.update@example.com"]

stages:
  - *auth_save_token

  - *create_student_save_all

  - name: "When a request with a valid json body,
            PUT /students/id returns 200 and a json body that matches request"
    request:
      url: "{tavern.env_vars.BASE_URL}/students/{returned_id}"
      method: PUT
      headers:
        Authorization: "Bearer {returned_access_token}"
        Content-Type: "application/json"
      json:
        last_name: "{update_last_name}"
        first_name: "{update_first_name}"
        middle_name: "{update_middle_name}"
        email: "{update_email}"
    response:
      status_code: 200
      json:
        id: !int "{returned_id:d}"
        last_name: "{update_last_name}"
        first_name: "{update_first_name}"
        middle_name: "{update_middle_name}"
        email: "{update_email}"

  - name: "When request is made,
            GET /students/id returns 200 and a json body that matches updated student"
    request:
      url: "{tavern.env_vars.BASE_URL}/students/{returned_id}"
      method: GET
      headers:
        Authorization: "Bearer {returned_access_token}"
    response:
      status_code: 200
      json:
        id: !int "{returned_id:d}"
        last_name: "{update_last_name}"
        first_name: "{update_first_name}"
        middle_name: "{update_middle_name}"
        email: "{update_email}"
    
finally:
  - *delete_student

  - *delete_student_check

