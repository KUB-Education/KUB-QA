test_name: When request with invalid security key header, GET /students/id returns 401

marks:
  - parametrize:
      key:
        - wrong_token
        - request_last_name
        - request_first_name
        - request_middle_name
        - request_email
      vals:
        - [ "satsgag", "Doe", "John", "", "john.doe@example.com"]

stages:
  - *auth_save_token

  - &create_student_save_id
    name: "When request with valid json body, POST /students returns 201"
