test_name: When request is made, GET /students/id returns 200 and a json body that matches created student

marks:
  - parametrize:
      key:
        - request_last_name
        - request_first_name
        - request_middle_name
        - request_email
      vals:
        - [ "Doe", "John", "", "john.doe@example.com"]
stages:
  - &auth_save_token
    name: "Login and save access token"
    request:
      url: "{tavern.env_vars.AUTH_URL}/auth/login"
      method: POST
      headers:
        Content-Type: "application/json"
      json:
        email: "{tavern.env_vars.ADMIN_EMAIL}"
        password: "{tavern.env_vars.ADMIN_PASSWORD}"
    response:
      status_code: 200
      json:
        access_token: !anystr
        refresh_token: !anystr
        first_login: !anybool
      save:
        json:
          returned_access_token: access_token
            
  - &create_student_save_all
    name: "When request with valid json body, POST /students returns 201"
    request:
      url: "{tavern.env_vars.BASE_URL}/students"
      method: POST
      headers:
        Authorization: "Bearer {returned_access_token}"
        Content-Type: "application/json"
      json:
        last_name: "{request_last_name}"
        first_name: "{request_first_name}"
        middle_name: "{request_middle_name}"
        email: "{request_email}"
    response:
      status_code: 201
      json:
        last_name: "{request_last_name}"
        first_name: "{request_first_name}"
        middle_name: "{request_middle_name}"
        email: "{request_email}"
    response:
      status_code: 201
      json:
        id: !anyint 
        last_name: "{request_last_name}"
        first_name: "{request_first_name}"
        middle_name: "{request_middle_name}"
        email: "{request_email}"
      save:
        json:
          returned_id: id
          returned_last_name: last_name
          returned_first_name: first_name
          returned_middle_name: middle_name
          returned_email: email


  - name: "When request is made,
            GET /students/id returns 200 and a json body that matches created student"
    request:
      url: "{tavern.env_vars.BASE_URL}/students/{returned_id}"
      method: GET
      headers:
        Authorization: "Bearer {returned_access_token}"
    response:
      status_code: 200
      json:
        id: !int "{returned_id:d}"
        last_name: "{returned_last_name}"
        first_name: "{returned_first_name}"
        middle_name: "{returned_middle_name}"
        email: "{returned_email}"


finally:
  - &delete_student
    name: "When student exists, DELETE /students/id returns 204"
    request:
      url: "{tavern.env_vars.BASE_URL}/students/{returned_id}"
      method: DELETE
      headers:
        Authorization: "Bearer {returned_access_token}"
    response:
      status_code: 204

  - &delete_student_check
    name: "When student deleted, GET /students/id returns 404"
    request:
      url: "{tavern.env_vars.BASE_URL}/students/{returned_id}"
      method: GET
      headers:
        Authorization: "Bearer {returned_access_token}"
    response:
      status_code: 404

