  - parametrize:
      key:
        - request_last_name
        - request_first_name
        - request_middle_name
        - request_email
        - update_last_name
        - update_first_name
        - update_middle_name
        - update_email
        - wrong_request_too_long
        - wrong_request_email
      vals:
        - ["Doe", "John", "", "john.doe@example.com", "Joe", "Dohn", "Doj", "john.update@example.com", 
        "iiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiii", "john.doe.example.com"]

stages:
  - *auth_save_token

  - *create_student_save_id

  - name: "When request with invalid json body data (last_name), PUT /students/id returns 422"
    request:
      url: "{tavern.env_vars.BASE_URL}/students/{returned_id}"
      method: PUT
      headers:
