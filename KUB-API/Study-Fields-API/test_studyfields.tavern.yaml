test_name: When request with valid json body, POST /studyfields returns 201

marks:
  - parametrize:
      key:
        - request_code
        - request_name
      vals:
        - [ "CS101","computer_science" ]
stages:
  - &auth_save_token
    name: Login and save access token
    request:
      url: "{tavern.env_vars.AUTH_URL}/auth/login"
      method: POST
      headers:
        Content-Type: "application/json"
      json:
        email: "{tavern.env_vars.ADMIN_EMAIL}"
        password: "{tavern.env_vars.ADMIN_PASSWORD}"
    response:
      status_code: 200
      json:
        access_token: !anystr
      save:
        json:
          returned_access_token: access_token

  - &create_studyfield
    name: "When request with valid json body, POST /studyfields returns 201"
    request:
      url: "{tavern.env_vars.BASE_URL}/studyfields"
      method: POST
      headers:
        Authorization: "Bearer {returned_access_token}"
        Content-Type: "application/json"
      json:
        code: "{request_code}"
        name: "{request_name}"
    response:
      status_code: 201
      json:
        id: !anyint 
        code: "{request_code}"
        name: "{request_name}"
      save:
        json:
          returned_id: id

  - name: "When response with valid json body structure, GET /studyfields returns 200"
    request:
      url: "{tavern.env_vars.BASE_URL}/studyfields"
      method: GET
      headers:
        Authorization: "Bearer {returned_access_token}"
        Content-Type: "application/json"
    response:
      status_code: 200
      verify_response_with:
        function: tavern.helpers:validate_pykwalify
          #Check response for valid schema according to openapi spec
          #validate_pykwalify used to validate more complicated JSON schemas
        extra_kwargs:
          schema:
            type: seq
            required: True
            matching: "all"
            sequence:
              - type: map
                mapping:
                  id:
                    type: int
                    required: True
                  code:
                    type: str
                    required: True
                  name:
                    type: str
                    required: True

finally:
  - &delete_studyfield
    name: "When study field exists, DELETE /studyfields/id returns 204"
    request:
      url: "{tavern.env_vars.BASE_URL}/studyfields/{returned_id}"
      method: DELETE
      headers:
        Authorization: "Bearer {returned_access_token}"
    response:
      status_code: 204

  - &delete_studyfield_check
    name: "When study field deleted, GET /studyfields/id returns 404"
    request:
      url: "{tavern.env_vars.BASE_URL}/studyfields/{returned_id}"
      method: GET
      headers:
        Authorization: "Bearer {returned_access_token}"
    response:
      status_code: 404

---

test_name: When request without json body, POST /studyfields returns 400

stages:
  - *auth_save_token

  - name: "When request without json body, POST /studyfields returns 400"
    request:
      url: "{tavern.env_vars.BASE_URL}/studyfields"
      method: POST
      headers:
        Authorization: "Bearer {returned_access_token}"
        Content-Type: "application/json"
    response:
      status_code: 400

---

test_name: When request with invalid security key header, POST /studyfields returns 401

marks:
  - parametrize:
      key:
        - wrong_token
        - request_code
        - request_name
      vals:
        - [ "satsgag", "CS101", "computer_science" ]

stages:
  - name: "When request with invalid security key header, POST /studyfields returns 401"
    request:
      url: "{tavern.env_vars.BASE_URL}/studyfields"
      method: POST
      headers:
        Authorization: "Bearer {wrong_token}"
        Content-Type: "application/json"
      json:
        code: "{request_code}"
        name: "{request_name}"
    response:
      status_code: 401

---

test_name: When request with json body that data match another user data, POST /studyfields returns 409

marks:
  - parametrize:
      key:
        - request_code
        - request_code_new
        - request_name
        - request_name_new
      vals:
        - [ "CS101", "MT101", "computer_science", "math"]

stages:
  - *auth_save_token
  
  - *create_studyfield

  - name: "When request with json body that data match another user data(name), POST /studyfields returns 409"
    request:
      url: "{tavern.env_vars.BASE_URL}/studyfields"
      method: POST
      headers:
        Authorization: "Bearer {returned_access_token}"
        Content-Type: "application/json"
      json:
        code: "{request_code_new}"
        name: "{request_name}"
    response:
      status_code: 409

  - name: "When request with json body that data match another user data(code), POST /studyfields returns 409"
    request:
      url: "{tavern.env_vars.BASE_URL}/studyfields"
      method: POST
      headers:
        Authorization: "Bearer {returned_access_token}"
        Content-Type: "application/json"
      json:
        code: "{request_code}"
        name: "{request_name_new}"
    response:
      status_code: 409

finally:
  - *delete_studyfield

  - *delete_studyfield_check
  
---

test_name: When request with wrong json body data, POST /studyfields returns 422

marks:
  - parametrize:
      key:
        - wrong_request_code
        - wrong_request_name
        - request_code
        - request_name
      vals:
        - [ "", "", "CS101", "computer_science"]

stages:
  - *auth_save_token

  - name: "When request with wrong json body data (code), POST /studyfields returns 422"
    request:
      url: "{tavern.env_vars.BASE_URL}/studyfields"
      method: POST
      headers:
        Authorization: "Bearer {returned_access_token}"
        Content-Type: "application/json"
      json:
        code: "{wrong_request_code}"
        name: "{request_name}"
    response:
      status_code: 422

  - name: "When request with wrong json body data (name), POST /studyfields returns 422"
    request:
      url: "{tavern.env_vars.BASE_URL}/studyfields"
      method: POST
      headers:
        Authorization: "Bearer {returned_access_token}"
        Content-Type: "application/json"
      json:
        code: "{request_code}"
        name: "{wrong_request_name}"
    response:
      status_code: 422
