test_name: When request is made, GET /studyfields/id returns 200 and a json body that matches created studyfield

marks:
  - parametrize:
      key:
        - request_code
        - request_name
      vals:
        - [ "CS101","computer_science" ]

stages:
  - &auth_save_token
    name: Login and save access token
    request:
      url: "{tavern.env_vars.AUTH_URL}/auth/login"
      method: POST
      headers:
        Content-Type: "application/json"
      json:
        email: "{tavern.env_vars.ADMIN_EMAIL:}"
        password: "{tavern.env_vars.ADMIN_PASSWORD}"
    response:
      status_code: 200
      json:
        access_token: !anystr
      save:
        json:
          returned_access_token: access_token
            
  - &create_studyfield_save_all
    name: "When request with valid json body, POST /studyfields returns 201"
    request:
      url: "{tavern.env_vars.BASE_URL}/studyfields"
      method: POST
      headers:
        Authorization: "Bearer {returned_access_token}"
        Content-Type: "application/json"
      json:
        code: "{request_code}"
        name: "{request_name}"
    response:
      status_code: 201
      json:
        id: !anyint
        code: "{request_code}"
        name: "{request_name}"
      save:
        json:
          returned_id: id
          returned_code: code
          returned_name: name

  - name: "When request is made,
            GET /studyfields/id returns 200 and a json body that matches created studyfield"
    request:
      url: "{tavern.env_vars.BASE_URL}/studyfields/{returned_id}"
      method: GET
      headers:
        Authorization: "Bearer {returned_access_token}"
    response:
      status_code: 200
      json:
        id: !int "{returned_id:d}"
        code: "{returned_code}"
        name: "{returned_name}"


finally:
  - &delete_studyfield
    name: "When study field exists, DELETE /studyfields/id returns 204"
    request:
      url: "{tavern.env_vars.BASE_URL}/studyfields/{returned_id}"
      method: DELETE
      headers:
        Authorization: "Bearer {returned_access_token}"
    response:
      status_code: 204

  - &delete_studyfield_check
    name: "When study field deleted, GET /studyfields/id returns 404"
    request:
      url: "{tavern.env_vars.BASE_URL}/studyfields/{returned_id}"
      method: GET
      headers:
        Authorization: "Bearer {returned_access_token}"
    response:
      status_code: 404

--- 

test_name: When request is made with extra parameters, GET /studyfields/id returns 400

marks:
  - parametrize:
      key:
        - request_code
        - request_name
        - request_extra_parameter
      vals:
        - [ "CS101","computer_science", "extra_info"]

stages:
  - *auth_save_token

  - &create_studyfield_save_id
    name: "When a request with a valid json body,
              POST /studyfields/id returns 201 and a json body that matches the request"
    request:
      url: "{tavern.env_vars.BASE_URL}/studyfields"
      method: POST
      headers:
        Authorization: "Bearer {returned_access_token}"
        Content-Type: "application/json"
      json:
        code: "{request_code}"
        name: "{request_name}"
    response:
      status_code: 201
      json:
        id: !anyint
        code: "{request_code}"
        name: "{request_name}"
      save:
        json:
          returned_id: id

  - name: "When request is made with extra parameters, GET /studyfields/id returns 400"
    request:
      url: "{tavern.env_vars.BASE_URL}/studyfields/{returned_id}"
      method: GET
      headers:
        Authorization: "Bearer {returned_access_token}"
      json:
        extra_parameter: "{request_extra_parameter}"
    response:
      status_code: 400

finally:
  - *delete_studyfield

  - *delete_studyfield_check

