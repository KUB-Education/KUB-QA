test_name:  When a request with a valid json body, PUT /studyfields/id returns 200 and a json body that matches request

marks:
  - parametrize:
      key:
        - request_code
        - request_name
        - update_code
        - update_name
      vals:
        - ["CS101", "computer_science", "MT101","math"]

stages:
  - *auth_save_token

  - *create_studyfield_save_all

  - name: "When a request with a valid json body,
            PUT /studyfields/id returns 200 and a json body that matches request"
    request:
      url: "{tavern.env_vars.BASE_URL}/studyfields/{returned_id}"
      method: PUT
      headers:
        Authorization: "Bearer {returned_access_token}"
        Content-Type: "application/json"
      json:
        code: "{update_code}"
        name: "{update_name}"
    response:
      status_code: 200
      json:
        id: !int "{returned_id:d}"
        code: "{update_code}"
        name: "{update_name}"

  - name: "When request is made,
            GET /studyfields/id returns 200 and a json body that matches updated studyfield"
    request:
      url: "{tavern.env_vars.BASE_URL}/studyfields/{returned_id}"
      method: GET
      headers:
        Authorization: "Bearer {returned_access_token}"
    response:
      status_code: 200
      json:
        id: !int "{returned_id:d}"
        code: "{update_code}"
        name: "{update_name}"
    

finally:
  - *delete_studyfield

  - *delete_studyfield_check

