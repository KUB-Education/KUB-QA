        - request_last_name
        - request_first_name
        - request_middle_name
        - request_email
        - request_department_id
        - request_academic_title
        - request_position
        - request_status
      vals:
      - [ "Doe", "John", "", "john.doe@example.com", 101, "DOCTOR_OF_PHILOSOPHY", "ASSISTANT", "ACTIVE" ]

stages:
