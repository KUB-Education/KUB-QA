test_name: When request with valid json body, POST /lecturers returns 201

marks:
  - parametrize:
      key:
        - request_last_name
        - request_first_name
        - request_middle_name
        - request_email
        - request_department_id
        - request_academic_title
        - request_position
        - request_status
      vals:
        - [ "Doe", "John", "", "john.doe@example.com", 101, "DOCTOR_OF_PHILOSOPHY", "ASSISTANT", "ACTIVE" ]

stages:
  - &create_lecturer
    name: "When lecturer json request is valid, POST /lecturers return 201"
    request:
      url: "{tavern.env_vars.BASE_URL}/lecturers"
      method: POST
      headers:
        Authorization : "Bearer {tavern.env_vars.ACCESS_TOKEN}"
        Content-Type: "application/json"
      json:
        last_name: "{request_last_name}"
        first_name: "{request_first_name}"
        middle_name: "{request_middle_name}"
        email: "{request_email}"
        department_id: "{request_department_id}"
        academic_title: "{request_academic_title}"
        position: "{request_position}"
        status: "{request_status}"
    response:
      status_code: 201
      json:
        id: !anyint
        last_name: "{request_last_name}"
        first_name: "{request_first_name}"
        middle_name: !anything
        email: "{request_email}"
        user_status: !anystr
        department_name: !anystr
        academic_title: "{request_academic_title}"
        position: "{request_position}"
        status: "{request_status}"
      save:
        json:
          returned_id: id

  - name: "When response with valid json body structure, GET /lecturers returns 200"
    request:
      url: "{tavern.env_vars.BASE_URL}/lecturers"
      method: GET
      headers:
        Authorization : "Bearer {tavern.env_vars.ACCESS_TOKEN}"
    response:
      status_code: 200
      verify_response_with:
        function: tavern.helpers:validate_pykwalify
          #Check response for valid schema according to openapi spec
          #validate_pykwalify used to validate more complicated JSON schemas
        extra_kwargs:
          schema:
            type: seq
            required: True
            matching: "all"
            sequence:
              - type: map
                mapping:
                  id:
                    type: int
                    required: True
                  last_name:
                    type: str
                    required: True
                  first_name:
                    type: str
                    required: True
                  middle_name:
                    type: str
                    required: False
                  email:
                    type: str
                    required: True
                  user_status:
                    type: str
                    required: True
                  department_name:
                    type: str
                    required: True
                  academic_title:
                    type: str
                    required: True
                  position:
                    type: str
                    required: True
                  status:
                    type: str
                    required: True

finally:
  - &delete_lecturer
    name: "When lecturer exists, DELETE /lecturers/id returns 204"
    request:
      url: "{tavern.env_vars.BASE_URL}/lecturers/{returned_id}"
      method: DELETE
      headers:
        Authorization : "Bearer {tavern.env_vars.ACCESS_TOKEN}"
    response:
      status_code: 204

  - &delete_lecturer_check
    name: "When lecturer deleted, GET /lecturers/id returns 404"
    request:
      url: "{tavern.env_vars.BASE_URL}/lecturers/{returned_id}"
      method: GET
      headers:
        Authorization : "Bearer {tavern.env_vars.ACCESS_TOKEN}"
    response:
      status_code: 404

