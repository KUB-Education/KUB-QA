test_name: When request is made, GET /lecturers/id returns 200 and a json body that matches created lecturer

marks:
  - parametrize:
      key:
        - request_last_name
        - request_first_name
        - request_middle_name
        - request_email
        - request_department_id
        - request_academic_title
        - request_position
        - request_status
      vals:
        - [ "Doe", "John", "", "john.doe@example.com", 101, "DOCTOR_OF_PHILOSOPHY", "ASSISTANT", "ACTIVE" ]

stages:
  - &create_lecturer_save_all
    name: "When lecturer json request is valid, POST /lecturers return 201"
    request:
      url: "{tavern.env_vars.BASE_URL}/lecturers"
      method: POST
      headers:
        Authorization : "Bearer {tavern.env_vars.ACCESS_TOKEN}"
        Content-Type: "application/json"
      json:
        last_name: "{request_last_name}"
        first_name: "{request_first_name}"
        middle_name: "{request_middle_name}"
        email: "{request_email}"
        department_id: "{request_department_id}"
        academic_title: "{request_academic_title}"
        position: "{request_position}"
        status: "{request_status}"
    response:
      status_code: 201
      json:
        id: !anyint
        last_name: "{request_last_name}"
        first_name: "{request_first_name}"
        middle_name: !anything
        email: "{request_email}"
        user_status: !anystr
        department_name: !anystr
        academic_title: "{request_academic_title}"
        position: "{request_position}"
        status: "{request_status}"
      save:
        json:
          returned_id: id
          returned_last_name: last_name
          returned_first_name: first_name
          returned_middle_name: middle_name
          returned_email: email
          returned_user_status: user_status
          returned_department_name: department_name
          returned_academic_title: academic_title
          returned_position: position
          returned_status: status

  - name: "When request is made,
            GET /lecturers/id returns 200 and a json body that matches created lecturer"
    request:
      url: "{tavern.env_vars.BASE_URL}/lecturers/{returned_id}"
      method: GET
      headers:
        Authorization : "Bearer {tavern.env_vars.ACCESS_TOKEN}"
    response:
      status_code: 200
      json:
        id: !int "{returned_id:d}"
        last_name: "{returned_last_name}"
        first_name: "{returned_first_name}"
        middle_name: !anything
        email: "{returned_email}"
        user_status: "{returned_user_status}"
        department_name: "{returned_department_name}"
        academic_title: "{returned_academic_title}"
        position: "{returned_position}"
        status: "{returned_status}"

finally:
  - &delete_lecturer
    name: "When lecturer exists, DELETE /lecturers/id returns 204"
    request:
      url: "{tavern.env_vars.BASE_URL}/lecturers/{returned_id}"
      method: DELETE
      headers:
        Authorization : "Bearer {tavern.env_vars.ACCESS_TOKEN}"
    response:
      status_code: 204

  - &delete_lecturer_check
    name:  "When lecturer deleted, GET /lecturers/id returns 404"
    request:
      url: "{tavern.env_vars.BASE_URL}/lecturers/{returned_id}"
      method: GET
      headers:
        Authorization : "Bearer {tavern.env_vars.ACCESS_TOKEN}"
    response:
      status_code: 404

