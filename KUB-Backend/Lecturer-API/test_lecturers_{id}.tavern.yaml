        first_name: "{request_first_name}"
        middle_name: "{request_middle_name}"
        email: "{request_email}"
        department_id: "{request_department_id}"
        academic_title: "{request_academic_title}"
        position: "{request_position}"
        status: "{request_status}"
    response:
      status_code: 201
      json:
        id: !anyint
        last_name: "{request_last_name}"
        first_name: "{request_first_name}"
        middle_name: !anything
        email: "{request_email}"
        user_status: !anystr
        department_name: !anystr
        academic_title: "{request_academic_title}"
        position: "{request_position}"
        status: "{request_status}"
      save:
        json:
          returned_id: id
          returned_user_status: user_status

  - name: "When a request with a valid json body,
            PUT /lecturers/id returns 200 and a json body that matches request"
    request:
      url: "{tavern.env_vars.BASE_URL}/lecturers/{returned_id}"
      method: PUT
      headers:
        Authorization : "Bearer {tavern.env_vars.ACCESS_TOKEN}"
        Content-Type: "application/json"
      json:
        last_name: "{update_last_name}"
        first_name: "{update_first_name}"
        middle_name: "{update_middle_name}"
        email: "{update_email}"
        department_id: "{update_department_id}"
        academic_title: "{update_academic_title}"
        position: "{update_position}"
        status: "{update_status}"
    response:
      status_code: 200
      json:
        id: !anyint
        last_name: "{update_last_name}"
        first_name: "{update_first_name}"
        middle_name: !anything
        email: "{update_email}"
        user_status: "{returned_user_status}"
        department_name: !anystr
        academic_title: "{update_academic_title}"
        position: "{update_position}"
        status: "{update_status}"
      save:
        returned_user_status: user_status

  - name: "When request is made,
            GET /lecturers/id returns 200 and a json body that matches updated lecturer"
    request:
      url: "{tavern.env_vars.BASE_URL}/lecturers/{returned_id}"
      method: GET
      headers:
        Authorization : "Bearer {tavern.env_vars.ACCESS_TOKEN}"
    response:
      status_code: 200
      json:
        id: !int "{returned_id:d}"
        last_name: "{update_last_name}"
        first_name: "{update_first_name}"
        middle_name: !anything
        email: "{update_email}"
        user_status: "{returned_user_status}"
        department_name: !anystr
        academic_title: "{update_academic_title}"
        position: "{update_position}"
        status: "{update_status}"

finally:
  - *delete_lecturer

  - *delete_lecturer_check

