---

test_name: When lecturer deleted, POST /lecturers/id/resend returns 404

marks:
  - parametrize:
      key:
        - request_last_name
        - request_first_name
        - request_middle_name
        - request_email
        - request_department_id
        - request_academic_title
        - request_position
        - request_status
      vals:
        - [ "Doe", "John", "", "john.doe@example.com", 101, "DOCTOR_OF_PHILOSOPHY", "ASSISTANT", "ACTIVE" ]

stages:
  - *create_lecturer

  - *delete_lecturer

  - name: "When lecturer deleted, POST /lecturers/id/resend returns 404"
    request:
      url: "{tavern.env_vars.BASE_URL}/lecturers/{returned_id}/resend"
      method: POST
      headers:
        Authorization: "Bearer {tavern.env_vars.ACCESS_TOKEN}"
    response:
      status_code: 404

  - *delete_lecturer_check

---

test_name: When request with invalid security key header, POST /lecturers/id/resend returns 401

marks:
  - parametrize:
      key:
        - wrong_token
        - request_last_name
        - request_first_name
        - request_middle_name
        - request_email
        - request_department_id
        - request_academic_title
        - request_position
        - request_status
      vals:
        - [ "satsgag", "Doe", "John", "", "john.doe@example.com", 101, "DOCTOR_OF_PHILOSOPHY", "ASSISTANT", "ACTIVE" ]

stages:
  - *create_lecturer

  - name: "When request with invalid security key header, POST /lecturers/id/resend returns 401"
    request:
      url: "{tavern.env_vars.BASE_URL}/lecturers/{returned_id}/resend"
      method: POST
      headers:
        Authorization: "{wrong_token}"
    response:
      status_code: 401

finally:
  - *delete_lecturer

  - *delete_lecturer_check