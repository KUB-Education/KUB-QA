test_name: When valid request is made, POST /lecturers/id/resend returns 200 and a json body what matches the created lecturer

marks:
  - parametrize:
      key:
        - request_last_name
        - request_first_name
        - request_middle_name
        - request_email
        - request_department_id
        - request_academic_title
        - request_position
        - request_status
      vals:
        - [ "Doe", "John", "", "john.doe@example.com", 101, "DOCTOR_OF_PHILOSOPHY", "ASSISTANT", "ACTIVE" ]

stages:
  - &create_lecturer
    name: "When request with valid json body, POST /lecturers returns 201"
    request:
      url: "{tavern.env_vars.BASE_URL}/lecturers"
      method: POST
      headers:
        Authorization: "Bearer {tavern.env_vars.ACCESS_TOKEN}"
        Content-Type: "application/json"
      json:
        last_name: "{request_last_name}"
        first_name: "{request_first_name}"
        middle_name: "{request_middle_name}"
        email: "{request_email}"
        department_id: "{request_department_id}"
        academic_title: "{request_academic_title}"
        position: "{request_position}"
        status: "{request_status}"
    response:
      status_code: 201
      json:
        id: !anyint
        last_name: "{request_last_name}"
        first_name: "{request_first_name}"
        middle_name: !anything
        email: "{request_email}"
        user_status: !anystr
        department_name: !anystr
        academic_title: "{request_academic_title}"
        position: "{request_position}"
        status: "{request_status}"
      save:
        json:
          returned_id: id
          returned_user_status: user_status

  - name: "When valid request is made,
            POST /lecturers/id/resend returns 200 and a json body what matches the created lecturer"
    request:
      url: "{tavern.env_vars.BASE_URL}/lecturers/{returned_id}/resend"
      method: POST
      headers:
        Authorization: "Bearer {tavern.env_vars.ACCESS_TOKEN}"
    response:
      status_code: 200
      json:
        id: !anyint
        last_name: "{request_last_name}"
        first_name: "{request_first_name}"
        middle_name: !anything
        email: "{request_email}"
        user_status: "{returned_user_status}"
        department_name: !anystr
        academic_title: "{request_academic_title}"
        position: "{request_position}"
        status: "{request_status}"

finally:
  - &delete_lecturer
    name: "When lecturer exists, DELETE /lecturers/id returns 204"
    request:
      url: "{tavern.env_vars.BASE_URL}/lecturers/{returned_id}"
      method: DELETE
      headers:
        Authorization: "Bearer {tavern.env_vars.ACCESS_TOKEN}"
    response:
      status_code: 204

  - &delete_lecturer_check
    name: "When lecturer deleted, GET /lecturers/id returns 404"
    request:
      url: "{tavern.env_vars.BASE_URL}/lecturers/{returned_id}"
      method: GET
      headers:
        Authorization: "Bearer {tavern.env_vars.ACCESS_TOKEN}"
    response:
      status_code: 404

---

test_name: When request with wrong lecturer id, POST /lecturers/id/resend returns 400

marks:
  - parametrize:
      key:
        - wrong_id
      vals:
        - [ "asafaf" ]

stages:
  - name: "When request with wrong lecturer id, POST /lecturers/id/resend returns 400"
    request:
      url: "{tavern.env_vars.BASE_URL}/lecturers/{wrong_id}/resend"
      method: POST
      headers:
        Authorization: "Bearer {tavern.env_vars.ACCESS_TOKEN}"
    response:
      status_code: 400

