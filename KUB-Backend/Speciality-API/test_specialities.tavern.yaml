---

test_name: When request without json body, POST /specialties returns 400

stages:
  - name: "When request without json body, POST /specialties returns 400"
    request:
      url: "{tavern.env_vars.BASE_URL}/specialties"
      method: POST
      headers:
        Authorization: "Bearer {tavern.env_vars.ACCESS_TOKEN}"
        Content-Type: "application/json"
    response:
      status_code: 400

---

test_name: When request with invalid security key header, POST /specialties returns 401

marks:
  - parametrize:
      key:
        - wrong_token
        - request_specialty_code
        - request_specialty_name
        - returned_study_field_id
      vals:
        - [ "satsgag", "12", "Інформаційні технології", "1" ]

stages:
  - name: "When request with invalid security key header, POST /specialties returns 401"
    request:
      url: "{tavern.env_vars.BASE_URL}/specialties"
      method: POST
      headers:
        Authorization: "Bearer {wrong_token}"
        Content-Type: "application/json"
      json:
        code: "{request_specialty_code}"
        name: "{request_specialty_name}"
        study_field_id: "{returned_study_field_id}"
    response:
      status_code: 401

---

test_name: When request with wrong json body data, POST /specialties returns 422

marks:
  - parametrize:
      key:
        - wrong_request_specialty_code
        - wrong_request_specialty_name
        - wrong_returned_study_field_id
      vals:
        - [ "1", "2", "1.5" ]

stages:
  - name: "When request with wrong json body data, POST /specialties returns 422"
    request:
      url: "{tavern.env_vars.BASE_URL}/specialties"
      method: POST
      headers:
        Authorization: "Bearer {tavern.env_vars.ACCESS_TOKEN}"
        Content-Type: "application/json"
      json:
        code: "{wrong_request_specialty_code}"
        name: "{wrong_request_specialty_name}"
        study_field_id: "{wrong_returned_study_field_id}"
    response:
      status_code: 422

