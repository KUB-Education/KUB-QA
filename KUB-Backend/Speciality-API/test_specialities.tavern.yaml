test_name: When request with json body that data match another user data, POST /specialties returns 409

marks:

  - parametrize:
      key:
        - request_specialty_code
        - request_specialty_name
        - returned_study_field_id
      vals:
        - [ "12", "Інформаційні технології", "1" ]

stages:
  - *create_specialty

  - name: "When request with json body that data match another user data, POST /specialties returns 409"
    request:
      url: "{tavern.env_vars.BASE_URL}/specialties"
      method: POST
      headers:
        Authorization: "Bearer {tavern.env_vars.ACCESS_TOKEN}"
        Content-Type: "application/json"
      json:
        code: "{request_specialty_code}"
        name: "{request_specialty_name}"
        study_field_id: "{returned_study_field_id}"
    response:
      status_code: 409

finally:
  - *delete_specialty

  - *delete_specialty_check