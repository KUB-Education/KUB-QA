test_name: When response with valid json body structure, GET /specialties returns 200

marks:
  - parametrize:
      key:
        #- request_study_field_code
        #- request_study_field_name
        - request_specialty_code
        - request_specialty_name
        - returned_study_field_id
      vals:
        - [ "12", "Інформаційні технології", "1" ]
        #- [ "12", "Інформаційні технології", "121", "Інженерія програмного забезпечення" ]

stages:
#  - name: "When study field json request is valid, POST /studyfields return 201"
#    request:
#      url: "{tavern.env_vars.BASE_URL}/studyfields"
#      method: POST
#      headers:
#        Content-Type: "application/json"
#        Authorization: "Bearer {tavern.env_vars.ACCESS_TOKEN}"
#      json:
#        code: "{request_study_field_code}"
#        name: "{request_study_field_name}"
#    response:
#      status_code: 201
#      json:
#        id: !anyint
#        code: "{request_study_field_code}"
#        name: "{request_study_field_name}"
#      save:
#        json:
#          returned_study_field_id: id

  - &create_specialty
    name: "When specialty json request is valid, POST /specialties return 201"
    request:
      url: "{tavern.env_vars.BASE_URL}/specialties"
      method: POST
      headers:
        Content-Type: "application/json"
        Authorization: "Bearer {tavern.env_vars.ACCESS_TOKEN}"
      json:
        code: "{request_specialty_code}"
        name: "{request_specialty_name}"
        study_field_id: "{returned_study_field_id}"
    response:
      status_code: 201
      json:
        id: !anyint
        code: "{request_specialty_code}"
        name: "{request_specialty_name}"
        field_of_study_name: !anystr
        #study_field_name:  !anystr #"{request_study_field_name}"
      save:
        json:
          returned_specialty_id: id

  - name: "When response with valid json body structure, GET /specialties returns 200"
    request:
      url: "{tavern.env_vars.BASE_URL}/specialties?name={request_specialty_name}&code={request_specialty_code}"
      method: GET
      headers:
        Authorization: "Bearer {tavern.env_vars.ACCESS_TOKEN}"
    response:
      status_code: 200
      verify_response_with:
        function: tavern.helpers:validate_pykwalify
        #Check response for valid schema according to openapi spec
        #validate_pykwalify used to validate more complicated JSON schemas
        extra_kwargs:
          schema:
            type: seq
            required: True
            matching: "all"
            sequence:
              - type: map
                mapping:
                  id:
                    type: int
                    required: True
                  code:
                    type: str
                    required: True
                  name:
                    type: str
                    required: True
                  field_of_study_name:
                    type: str
                    required: True

finally:
  - &delete_specialty
    name: "When specialty exists, DELETE /specialties/id returns 204"
    request:
      url: "{tavern.env_vars.BASE_URL}/specialties/{returned_specialty_id}"
      method: DELETE
      headers:
        Authorization: "Bearer {tavern.env_vars.ACCESS_TOKEN}"
    response:
      status_code: 204

  - &delete_specialty_check
    name: "When specialty deleted, GET /specialties/id returns 404"
    request:
      url: "{tavern.env_vars.BASE_URL}/specialties/{returned_specialty_id}"
      method: GET
      headers:
       Authorization: "Bearer {tavern.env_vars.ACCESS_TOKEN}"
    response:
      status_code: 404

