test_name: When request with id of study field what doesn't exist, POST /specialties returns 401

marks:
  - parametrize:
      key:
        - request_specialty_code
        - request_specialty_name
        - wrong_returned_study_field_id
      vals:
        - [ "3", "4", "10" ]

stages:
  - name: "When request with id of study field what doesn't exist, POST /specialties returns 404"
    request:
      url: "{tavern.env_vars.BASE_URL}/specialties"
      method: POST
      headers:
        Authorization: "Bearer {tavern.env_vars.ACCESS_TOKEN}"
        Content-Type: "application/json"
      json:
        code: "{request_specialty_code}"
        name: "{request_specialty_name}"
        study_field_id: "{wrong_returned_study_field_id}"
    response:
      status_code: 404

