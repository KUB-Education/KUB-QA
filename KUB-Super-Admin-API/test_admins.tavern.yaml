test_name: When request with json body that data match another user data, POST /admins returns 409

marks:
  - usefixtures:
    - admin_setup_description
    - admin_cleanup_description
    - admin_cleanup_check_description
  - parametrize:
      key:
        - request_last_name
        - request_first_name
        - request_middle_name
        - request_email
      vals:
        - [ "Doe", "John", "Edward", "john.doe@example.com" ]

stages:
  - *create_admin

  - name: "When request with json body that data match another user data, POST /admins returns 409"
    request:
      url: "{tavern.env_vars.BASE_URL}/admins"
      method: POST
      headers:
        X-SUPER-ADMIN-KEY: "{tavern.env_vars.TOKEN}"
        Content-Type: "application/json"
      json:
        last_name: "{request_last_name}"
        first_name: "{request_first_name}"
        middle_name: "{request_middle_name}"
        email: "{request_email}"
    response:
      status_code: 409

finally:
  - *delete_admin

  - *delete_admin_check