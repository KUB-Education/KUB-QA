test_name: Test methods for positive cases and data coherency

marks:
  - parametrize:
      key:
        - request_last_name
        - request_first_name
        - request_middle_name
        - request_email
        - update_last_name
        - update_first_name
        - update_middle_name
        - update_email
      vals:
        - ["Doe", "John", "Edward", "john.doe@example.com", "Smith", "Alice", "Bob", "alice.smith@example.com"]

stages:
  - name: "When a request with a valid json body,
            POST /admins/id returns 201 and a json body that matches the request"
    request:
      url: "{tavern.env_vars.BASE_URL}/admins"
      method: POST
      headers:
        X-SUPER-ADMIN-KEY: "{tavern.env_vars.TOKEN}"
        Content-Type: "application/json"
      json:
        last_name: "{request_last_name}"
        first_name: "{request_first_name}"
        middle_name: "{request_middle_name}"
        email: "{request_email}"
    response:
      status_code: 201
      json:
        id: !anyint
        user_id: !anyint
        last_name: "{request_last_name}"
        first_name: "{request_first_name}"
        middle_name: "{request_middle_name}"
        email: "{request_email}"
        status: !anystr
      save:
        json:
          returned_id: id
          returned_user_id: user_id
          returned_last_name: last_name
          returned_first_name: first_name
          returned_middle_name: middle_name
          returned_email: email
          returned_status: status

  - name: "When request,
            GET /admins/id returns 200 and a json body that matches created admin"
    request:
      url: "{tavern.env_vars.BASE_URL}/admins/{returned_id}"
      method: GET
      headers:
        X-SUPER-ADMIN-KEY: "{tavern.env_vars.TOKEN}"
    response:
      status_code: 200
      json:
        id: !int "{returned_id:d}"
        user_id: !int "{returned_user_id:d}"
        last_name: "{returned_last_name}"
        first_name: "{returned_first_name}"
        middle_name: "{returned_middle_name}"
        email: "{returned_email}"
        status: "{returned_status}"

  - name: "When a request with a valid json body,
            PUT returns 200 and a json body that matches request"
    request:
      url: "{tavern.env_vars.BASE_URL}/admins/{returned_id}"
      method: PUT
      headers:
        X-SUPER-ADMIN-KEY: "{tavern.env_vars.TOKEN}"
        content: "application/json"
      json:
        last_name: "{update_last_name}"
        first_name: "{update_first_name}"
        middle_name: "{update_middle_name}"
        email: "{update_email}"
    response:
      status_code: 200
      json:
        id: !int "{returned_id:d}"
        user_id: !int "{returned_user_id:d}"
        last_name: "{update_last_name}"
        first_name: "{update_first_name}"
        middle_name: "{update_middle_name}"
        email: "{update_email}"
        status: !anystr

  - name: "When request,
            GET /admins/id returns 200 and a json body that matches updated admin"
    request:
      url: "{tavern.env_vars.BASE_URL}/admins/{returned_id}"
      method: GET
      headers:
        X-SUPER-ADMIN-KEY: "{tavern.env_vars.TOKEN}"
    response:
      status_code: 200
      json:
        id: !int "{returned_id:d}"
        user_id: !int "{returned_user_id:d}"
        last_name: "{update_last_name}"
        first_name: "{update_first_name}"
        middle_name: "{update_middle_name}"
        email: "{update_email}"
        status: !anystr

finally:
  - name: "When admin exists, DELETE /admins/id returns 204"
    request:
      url: "{tavern.env_vars.BASE_URL}/admins/{returned_id}"
      method: DELETE
      headers:
        X-SUPER-ADMIN-KEY: "{tavern.env_vars.TOKEN}"
    response:
      status_code: 204

  - name:  "When admin deleted, GET /admins/id returns 404"
    request:
      url: "{tavern.env_vars.BASE_URL}/admins/{returned_id}"
      method: GET
      headers:
        X-SUPER-ADMIN-KEY: "{tavern.env_vars.TOKEN}"
    response:
      status_code: 404

