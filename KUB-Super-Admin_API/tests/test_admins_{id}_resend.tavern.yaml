test_name: test admins/{id}/resend endpoint for bad request error

marks:
  - parametrize:
      key:
        - wrong_id
      vals:
        - ["agadg"]

stages:
  - name: check admins/id/resend get for bad request error
    request:
      url: "{tavern.env_vars.BASE_URL}/admins/{wrong_id}/resend"
      method: GET
      headers:
        X-SUPER-ADMIN-KEY: "{tavern.env_vars.TOKEN}"
    response:
      status_code: 400

