      key:
        - wrong_token
        - request_last_name
        - request_first_name
        - request_middle_name
        - request_email
      vals:
        - [ "satsgag", "Doe", "John", "Edward", "john.doe@example.com" ]

stages:
  - name: create test admin
    request:
      url: "{tavern.env_vars.BASE_URL}/admins"
      method: POST
      headers:
